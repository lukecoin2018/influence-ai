# InfluenceIT: never cache authenticated routes.
# Included by Webuzo from /var/webuzo-data/nginx/custom/domains/influenceit.app.conf
location ~ ^/(creator-dashboard|admin|dashboard|api)(/|$) {
    proxy_cache off;
    add_header X-Cache-Status "BYPASS" always;
    include /usr/local/apps/nginx/etc/conf.d/proxy.conf;
    proxy_ssl_server_name on;
    proxy_pass $webuzoproxy;
}
